openapi: 3.0.3
info:
  title: Aggriconnect API
  version: 1.0.0
  description: This Api is helps you to get idea about how API will hit with how many
    parameters and request type and it also helps you to test it
paths:
  /admin-api/api/token/:
    post:
      operationId: admin_api_api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /admin-api/api/token/refresh/:
    post:
      operationId: admin_api_api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /admin-api/password-reset-confirm/:
    post:
      operationId: admin_api_password_reset_confirm_create
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /admin-api/password-reset-request/:
    post:
      operationId: admin_api_password_reset_request_create
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /farmer-api/farmer/:
    get:
      operationId: farmer_api_farmer_list
      description: |-
        This is The common Viewset which will allow specific requests
        in the viewsets. This is only for Model Viewsets
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - farmer-api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFarmerList'
          description: ''
    post:
      operationId: farmer_api_farmer_create
      description: |-
        This is The common Viewset which will allow specific requests
        in the viewsets. This is only for Model Viewsets
      tags:
      - farmer-api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Farmer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Farmer'
          application/json:
            schema:
              $ref: '#/components/schemas/Farmer'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
          description: ''
  /farmer-api/farmer/{f_id}/:
    get:
      operationId: farmer_api_farmer_retrieve
      description: |-
        This is The common Viewset which will allow specific requests
        in the viewsets. This is only for Model Viewsets
      parameters:
      - in: path
        name: f_id
        schema:
          type: integer
        description: A unique integer value identifying this farmer.
        required: true
      tags:
      - farmer-api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
          description: ''
    put:
      operationId: farmer_api_farmer_update
      description: |-
        This is The common Viewset which will allow specific requests
        in the viewsets. This is only for Model Viewsets
      parameters:
      - in: path
        name: f_id
        schema:
          type: integer
        description: A unique integer value identifying this farmer.
        required: true
      tags:
      - farmer-api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Farmer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Farmer'
          application/json:
            schema:
              $ref: '#/components/schemas/Farmer'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
          description: ''
    patch:
      operationId: farmer_api_farmer_partial_update
      description: |-
        This is The common Viewset which will allow specific requests
        in the viewsets. This is only for Model Viewsets
      parameters:
      - in: path
        name: f_id
        schema:
          type: integer
        description: A unique integer value identifying this farmer.
        required: true
      tags:
      - farmer-api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFarmer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFarmer'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFarmer'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farmer'
          description: ''
components:
  schemas:
    Farmer:
      type: object
      properties:
        f_id:
          type: integer
          readOnly: true
        user_name:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        gender:
          $ref: '#/components/schemas/GenderEnum'
        sub_district:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 255
        ekyf_id:
          type: string
          maxLength: 15
        f_phone:
          type: string
          pattern: ^[0-9]{10,11}$
          maxLength: 11
        f_photo:
          type: string
          format: uri
          nullable: true
        aadhar_no:
          type: string
          maxLength: 12
      required:
      - aadhar_no
      - ekyf_id
      - f_id
      - f_phone
      - first_name
      - gender
      - password
      - state
      - sub_district
      - user_name
    GenderEnum:
      enum:
      - M
      - F
      type: string
      description: |-
        * `M` - MALE
        * `F` - FEMALE
    PaginatedFarmerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Farmer'
    PasswordResetConfirm:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 8
        uidb64:
          type: string
        token:
          type: string
      required:
      - password
      - token
      - uidb64
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PatchedFarmer:
      type: object
      properties:
        f_id:
          type: integer
          readOnly: true
        user_name:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        gender:
          $ref: '#/components/schemas/GenderEnum'
        sub_district:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 255
        ekyf_id:
          type: string
          maxLength: 15
        f_phone:
          type: string
          pattern: ^[0-9]{10,11}$
          maxLength: 11
        f_photo:
          type: string
          format: uri
          nullable: true
        aadhar_no:
          type: string
          maxLength: 12
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
